name: Payroll Pro Billing API CI

on:
  push:
    branches: [main]
    paths:
      - 'billing-api/**'
      - '.github/workflows/billing-api-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'billing-api/**'
      - '.github/workflows/billing-api-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billing-api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: billing-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 24) { console.error('Node.js 24+ is required'); process.exit(1) }"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check
