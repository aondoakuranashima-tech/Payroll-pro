name: Android Security & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Dependency vulnerability scan
        uses: dependency-review-action@v4
        if: github.event_name == 'pull_request'

      - name: Check for obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '(sk_(live|test)_[A-Za-z0-9]+|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|GEMINI_API_KEY=[^M][^Y][^_][^G])' -- . ':(exclude).env.example'; then
            echo 'Potential secret detected. Remove it and rotate the credential.'
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Lint
        run: ./gradlew lint --no-daemon
